name: CI
on:
  push:
    branches: [main, testing, desarrollo, "feature/**"]
  pull_request:
    branches: [main, testing, desarrollo]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run check
